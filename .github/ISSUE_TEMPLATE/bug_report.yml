name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 提交前请搜索已有 Issue，并移除日志中的 Token、API Key 和用户数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 ...
        2. 调用 ...
        3. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际问题
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: OS、JDK、Maven、MySQL、Redis、RabbitMQ 版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志
      render: shell